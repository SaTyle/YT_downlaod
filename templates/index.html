<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34">
          <path fill="#ff0033" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"/>
          <path fill="#fff" d="M9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
        </svg>
      </div>
      <h1>YouTube Downloader</h1>
      <p class="sub">Paste a link, pick a quality, download at full speed.</p>
    </header>

    <section class="card">
      <div class="input-row">
        <input
          id="url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="fetchBtn" class="btn primary">Fetch</button>
      </div>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <section id="videoCard" class="card video-card hidden">
      <div class="thumb-wrap">
        <img id="thumb" alt="Video thumbnail" />
        <span id="duration" class="duration"></span>
      </div>
      <div class="meta">
        <h2 id="title"></h2>
        <p id="uploader" class="uploader"></p>

        <div class="controls">
          <label class="field">
            <span>Quality</span>
            <select id="quality"></select>
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="audioOnly" />
            <span>Audio only (MP3)</span>
          </label>
        </div>

        <button id="downloadBtn" class="btn primary full">Download</button>

        <div id="progressBox" class="progress-box hidden">
          <div class="bar-track"><div id="bar" class="bar-fill"></div></div>
          <div class="progress-info">
            <span id="progressPct">0%</span>
            <span id="progressStat"></span>
          </div>
        </div>

        <a id="saveLink" class="btn success full hidden" download>Save file ⬇</a>
      </div>
    </section>

    <footer class="foot">
      <p>Runs locally on your machine · <code>yt-dlp</code> + <code>ffmpeg</code></p>
      <p class="tiny">For personal use. Respect copyright and YouTube's Terms of Service.</p>
    </footer>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
